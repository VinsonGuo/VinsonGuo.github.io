# Site Build Settings

# Jekyll-paginate-v2 configuration
#  pagination:
#   enabled: true
#   per_page: 5
#   permalink: '/page/:num/'
#   title: ':title - page :num of :max'
#   limit: 0
#   sort_field: 'date'
#   sort_reverse: true

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# Projects collection (product showcase pages)
collections:
  projects:
    output: true
    permalink: /projects/:slug/

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
url:                 'https://vinsonguo.github.io'
title:               'Vinson Guo'
tagline:             'Indie Mobile Developer'
description:         "Hi, I'm Vinson Guo, an indie developer dedicated to building innovative and reliable mobile apps across iOS, Android, macOS, Windows, and Linux."
author:              'Vinson Guo'
logo:                /assets/img/avatar.png

twitter:
  username:          vinson_guo
  card:              summary_large_image

social:
  name:              Vinson Guo
  links:
    - https://github.com/VinsonGuo
    - https://twitter.com/vinson_guo
    - https://bsky.app/profile/vinsonguo.bsky.social
    - https://play.google.com/store/apps/dev?id=7269031955117533398

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-home.png
  - scope:
      path: "googleaee5e933b3c08804.html"
    values:
      sitemap: false

exclude:
  - scripts

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
