<head>
  <title>{% if page.seo_title %}{{ page.seo_title }} | {{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/product.css">
  <style>:root{--p-accent:{% if page.accent %}{{ page.accent }}{% else %}#0071e3{% endif %};--p-accent-text:{% if page.accent_text %}{{ page.accent_text }}{% elsif page.accent %}{{ page.accent }}{% else %}#0071e3{% endif %};--p-accent-contrast:{% if page.accent_contrast %}{{ page.accent_contrast }}{% else %}#ffffff{% endif %}}</style>
  {% feed_meta %}
  {% if page.logo %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.github.url }}{{ page.logo }}">
  <link rel="icon" type="image/png" href="{{ site.github.url }}{{ page.logo }}">
  {% else %}
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  {% endif %}
  <link rel="manifest" href="/site.webmanifest">
  {% include google-analytics.html %}
  {% seo title=false %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | default: page.tagline | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "applicationCategory": {{ page.app_category | default: "UtilitiesApplication" | jsonify }},
    "operatingSystem": {{ page.platforms | join: ", " | jsonify }},
    "image": {{ page.image | default: page.logo | absolute_url | jsonify }},
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": {{ site.author | jsonify }},
      "url": {{ site.url | jsonify }}
    }{% if page.downloads and page.downloads.size > 0 %},
    "downloadUrl": {{ page.downloads[0].url | jsonify }},
    "sameAs": [{% for d in page.downloads %}{{ d.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]{% endif %}{% if page.showcase_screenshots and page.showcase_screenshots.size > 0 %},
    "screenshot": [{% for img in page.showcase_screenshots %}{{ img | absolute_url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]{% endif %}
  }
  </script>
</head>
